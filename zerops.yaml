zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd server && npm ci
        - cd server && npm run build
      deployFiles:
        - server/dist
        - server/drizzle
        - server/package.json
        - server/node_modules
      cache:
        - server/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 4000
          path: /api/health
        failureTimeout: 90s
    run:
      base: nodejs@22
      ports:
        - port: 4000
          httpSupport: true
      # Migrations run before the process starts, so a deploy that changes the
      # schema can never serve traffic against the old one.
      initCommands:
        - node server/dist/db/migrate.js
      start: node server/dist/index.js
      healthCheck:
        httpGet:
          port: 4000
          path: /api/health
        execPeriod: 30s
      envVariables:
        NODE_ENV: production
        PORT: 4000
        DATABASE_URL: ${db_connectionString}
        # Cross-service references such as ${web_zeropsSubdomain} arrive here as
        # literal text rather than a URL, so these are spelled out. They are
        # public addresses, not secrets — unlike SESSION_SECRET and
        # CREDENTIALS_KEY, which live on the service and must not be named here.
        API_ORIGIN: https://api-2b3f-4000.prg1.zerops.app
        CORS_ORIGIN: https://web-2b3f-3000.prg1.zerops.app

  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next
        - public
        - next.config.ts
        - package.json
        - node_modules
      cache:
        - node_modules
        - .next/cache
      envVariables:
        # Next inlines NEXT_PUBLIC_* at build time, so this has to be set here
        # rather than at run time — and spelled out, since the cross-service
        # reference is not substituted.
        NEXT_PUBLIC_API_URL: https://api-2b3f-4000.prg1.zerops.app/api
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          # Not /, which redirects to the sign-in page when the request has no
          # session — a readiness check reads that redirect as unhealthy.
          path: /login
        failureTimeout: 90s
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npx next start -p 3000
      envVariables:
        NODE_ENV: production
